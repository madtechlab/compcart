<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaD CompCart</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#1a472a;color:white;padding:15px}
.logo{font-size:20px;font-weight:bold}
.section{padding:15px}
.card{
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
button{cursor:pointer}
.btn{padding:8px 12px;margin-top:5px}
.delete{background:none;border:none;color:red;font-size:16px}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MaD-CompCart</div>
  <div id="savings-badge"></div>
</div>

<div class="section">

<h3>Add Store</h3>
<input id="s-name" placeholder="Store name">
<button class="btn" onclick="addStore()">Add</button>

<h3>Add Price</h3>
<input id="p-name" placeholder="Item">
<input id="p-price" type="number" placeholder="Price">
<select id="p-store"></select>
<button class="btn" onclick="addEntry()">Add</button>

<h3>Prices</h3>
<div id="prices-list"></div>

<h3>Stores</h3>
<div id="stores-list"></div>

<h3>Deals</h3>
<div id="deals-content"></div>

</div>

<script>
let db = { stores: [], entries: [] };

/* STORE */
function addStore(){
  const name = sName().value.trim();
  if(!name) return alert("Enter store");

  db.stores.push({id:Date.now(),name});
  sName().value="";

  renderStores();
  refreshStores();
}

function removeStore(id){
  db.stores = db.stores.filter(s=>s.id!==id);

  renderStores();
  refreshStores();
  renderDeals();
  updateSavings();
}

/* ENTRY */
function addEntry(){
  const name = pName().value.trim();
  const price = parseFloat(pPrice().value);

  if(!name || isNaN(price)) return alert("Fill fields");
  if(!db.stores.length) return alert("Add store first");

  const store = db.stores[pStore().value].name;

  const entry={id:Date.now(),name,price,store};
  db.entries.push(entry);

  checkAlert(entry);

  pName().value="";
  pPrice().value="";

  renderPrices();
  renderDeals();
  updateSavings();
}

function removeEntry(id){
  db.entries = db.entries.filter(e=>e.id!==id);

  renderPrices();
  renderDeals();
  updateSavings();
}

/* UI */
function renderStores(){
  const el = document.getElementById("stores-list");

  if(!db.stores.length){
    el.innerHTML="No stores";
    return;
  }

  el.innerHTML = db.stores.map(s=>`
    <div class="card">
      ${s.name}
      <button class="delete" onclick="removeStore(${s.id})">❌</button>
    </div>
  `).join("");
}

function renderPrices(){
  const el = document.getElementById("prices-list");

  if(!db.entries.length){
    el.innerHTML="No prices";
    return;
  }

  el.innerHTML = db.entries.map(e=>`
    <div class="card">
      ${e.name} — ${e.store} — $${e.price.toFixed(2)}
      <button class="delete" onclick="removeEntry(${e.id})">❌</button>
    </div>
  `).join("");
}

function refreshStores(){
  const el = pStore();
  el.innerHTML = db.stores.map((s,i)=>
    `<option value="${i}">${s.name}</option>`
  ).join("");
}

/* DEAL LOGIC */
function bestDeals(){
  const map={};

  db.entries.forEach(e=>{
    if(!map[e.name]) map[e.name]={best:e,worst:e};
    else{
      if(e.price<map[e.name].best.price) map[e.name].best=e;
      if(e.price>map[e.name].worst.price) map[e.name].worst=e;
    }
  });

  return map;
}

function plan(){
  const p={};
  const deals=bestDeals();

  Object.values(deals).forEach(d=>{
    const b=d.best;
    if(!p[b.store]) p[b.store]=[];
    p[b.store].push(b);
  });

  return p;
}

function renderDeals(){
  const el=document.getElementById("deals-content");

  if(!db.entries.length){
    el.innerHTML="No data";
    return;
  }

  const p=plan();
  let total=0;

  Object.values(bestDeals()).forEach(d=>{
    total+=d.worst.price-d.best.price;
  });

  el.innerHTML=`
    <div class="card" style="flex-direction:column;align-items:flex-start">
      <b>Smart Plan</b><br><br>
      ${Object.keys(p).map(store=>`
        <b>${store}</b><br>
        ${p[store].map(i=>`• ${i.name} $${i.price}`).join("<br>")}
        <br><br>
      `).join("")}
      <b>Total Saved: $${total.toFixed(2)}</b>
    </div>
  `;
}

/* SAVINGS */
function updateSavings(){
  let total=0;

  Object.values(bestDeals()).forEach(d=>{
    total+=d.worst.price-d.best.price;
  });

  document.getElementById("savings-badge").innerText=
    total?`💰 Save $${total.toFixed(2)}`:"";
}

/* ALERT */
function checkAlert(e){
  if(e.price<5){
    alert(`${e.name} under $5 ✅`);
  }
}

/* shortcuts */
const sName=()=>document.getElementById("s-name");
const pName=()=>document.getElementById("p-name");
const pPrice=()=>document.getElementById("p-price");
const pStore=()=>document.getElementById("p-store");

</script>

</body>
</html>
