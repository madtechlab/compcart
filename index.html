<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaD CompCart</title>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
}

.header {
  background:#1a472a;
  color:white;
  padding:16px;
}

.logo {
  font-size:22px;
  font-weight:bold;
}

#savings-badge {
  margin-top:5px;
  font-size:14px;
}

.container {
  padding:16px;
  max-width:600px;
  margin:auto;
}

.card {
  background:white;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input, select {
  padding:8px;
  margin:5px 0;
  width:100%;
}

button {
  padding:8px 12px;
  margin-top:8px;
  cursor:pointer;
}

.delete {
  background:none;
  border:none;
  color:red;
  font-size:16px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">MaD-CompCart</div>
  <div id="savings-badge"></div>
</div>

<div class="container">

<h3>Add Store</h3>
<input id="s-name" placeholder="Store name">
<button onclick="addStore()">Add Store</button>

<h3>Add Price</h3>
<input id="p-name" placeholder="Item name">
<input id="p-price" type="number" placeholder="Price">
<select id="p-store"></select>
<button onclick="addEntry()">Add Price</button>

<h3>Prices</h3>
<div id="prices-list"></div>

<h3>Stores</h3>
<div id="stores-list"></div>

<h3>Smart Plan</h3>
<div id="deals-content"></div>

</div>

<script>
let db = { stores: [], entries: [] };

/* STORE */
function addStore(){
  const name = document.getElementById("s-name").value.trim();
  if(!name) return alert("Enter store");

  db.stores.push({ id:Date.now(), name });
  document.getElementById("s-name").value="";

  renderStores();
  refreshStores();
}

/* ✅ DELETE STORE */
function removeStore(id){
  db.stores = db.stores.filter(s=>s.id !== id);

  renderStores();
  refreshStores();
  renderDeals();
  updateSavings();
}

/* ENTRY */
function addEntry(){
  const name = document.getElementById("p-name").value.trim();
  const price = parseFloat(document.getElementById("p-price").value);
  const storeIndex = document.getElementById("p-store").value;

  if(!name || isNaN(price)) return alert("Fill fields");
  if(!db.stores.length) return alert("Add store first");

  const store = db.stores[storeIndex].name;

  const entry = { id:Date.now(), name, price, store };
  db.entries.push(entry);

  /* ✅ ALERT */
  if(price < 5){
    alert(`${name} dropped below $5 ✅`);
  }

  document.getElementById("p-name").value="";
  document.getElementById("p-price").value="";

  renderPrices();
  renderDeals();
  updateSavings();
}

/* ✅ DELETE ENTRY */
function removeEntry(id){
  db.entries = db.entries.filter(e=>e.id !== id);

  renderPrices();
  renderDeals();
  updateSavings();
}

/* UI */
function renderStores(){
  const el = document.getElementById("stores-list");

  if(!db.stores.length){
    el.innerHTML="No stores yet";
    return;
  }

  el.innerHTML = db.stores.map(s => `
    <div class="card">
      ${s.name}
      <button class="delete" onclick="removeStore(${s.id})">❌</button>
    </div>
  `).join("");
}

function renderPrices(){
  const el = document.getElementById("prices-list");

  if(!db.entries.length){
    el.innerHTML="No prices yet";
    return;
  }

  el.innerHTML = db.entries.map(e => `
    <div class="card">
      ${e.name} — ${e.store} — $${e.price.toFixed(2)}
      <button class="delete" onclick="removeEntry(${e.id})">❌</button>
    </div>
  `).join("");
}

function refreshStores(){
  const el = document.getElementById("p-store");

  el.innerHTML = db.stores.map((s,i)=>
    `<option value="${i}">${s.name}</option>`
  ).join("");
}

/* DEALS */
function calculateDeals(){
  const map = {};

  db.entries.forEach(e=>{
    if(!map[e.name]) map[e.name]={best:e,worst:e};
    else{
      if(e.price < map[e.name].best.price) map[e.name].best=e;
      if(e.price > map[e.name].worst.price) map[e.name].worst=e;
    }
  });

  return map;
}

function renderDeals(){
  const el = document.getElementById("deals-content");

  if(!db.entries.length){
    el.innerHTML="No data yet";
    return;
  }

  const deals = calculateDeals();
  let total = 0;

  const html = Object.values(deals).map(d=>{
    total += (d.worst.price - d.best.price);

    return `
      <div class="card">
        <div>
          ${d.best.name}<br>
          Best: ${d.best.store} - $${d.best.price.toFixed(2)}
        </div>
      </div>
    `;
  }).join("");

  el.innerHTML = html + `<b>Total Saved: $${total.toFixed(2)}</b>`;
}

/* SAVINGS BADGE */
function updateSavings(){
  let total = 0;

  Object.values(calculateDeals()).forEach(d=>{
    total += (d.worst.price - d.best.price);
  });

  document.getElementById("savings-badge").innerText =
    total ? `💰 You save $${total.toFixed(2)}` : "";
}
</script>

</body>
</html>
