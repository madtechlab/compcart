
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaD CompCart</title>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; }
.header { background:#1a472a; color:white; padding:15px; }
.logo { font-size:20px; font-weight:bold; }
.cards { padding:15px; }
.card {
  background:white;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
button { cursor:pointer }
.delete { background:none; border:none; font-size:16px; }
</style>
</head>

<body>

<div class="header">
  <div class="logo">MaD-CompCart</div>
  <div id="savings-badge"></div>
</div>

<div class="cards">
  <h3>Add Store</h3>
  <input id="s-name" placeholder="Store name">
  <button onclick="addStore()">Add</button>

  <h3>Add Price</h3>
  <input id="p-name" placeholder="Item">
  <input id="p-price" type="number" placeholder="Price">
  <select id="p-store"></select>
  <button onclick="addEntry()">Add</button>

  <h3>Prices</h3>
  <div id="prices-list"></div>

  <h3>Stores</h3>
  <div id="stores-list"></div>

  <h3>Deals</h3>
  <div id="deals-content"></div>
</div>

<script>
let db = { stores: [], entries: [] };

/* ───────── STORES ───────── */
function addStore() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) return alert('Enter store');

  db.stores.push({ name, id: Date.now() });
  document.getElementById('s-name').value = '';

  renderStores();
  refreshStoreSelects();
}

function removeStore(id) {
  db.stores = db.stores.filter(s => s.id !== id);

  renderStores();
  refreshStoreSelects();
  renderDeals();
  updateSavingsBadge();
}

/* ───────── ENTRIES ───────── */
function addEntry() {
  const name = document.getElementById('p-name').value.trim();
  const price = parseFloat(document.getElementById('p-price').value);
  const storeIndex = document.getElementById('p-store').value;

  if (!name || isNaN(price)) return alert('Fill fields');
  if (!db.stores.length) return alert('Add store first');

  const store = db.stores[storeIndex].name;

  const entry = {
    id: Date.now(),
    name,
    price,
    store
  };

  db.entries.push(entry);

  checkPriceAlerts(entry);

  document.getElementById('p-name').value = '';
  document.getElementById('p-price').value = '';

  renderPrices();
  renderDeals();
  updateSavingsBadge();
}

function removeEntry(id) {
  db.entries = db.entries.filter(e => e.id !== id);

  renderPrices();
  renderDeals();
  updateSavingsBadge();
}

/* ───────── UI ───────── */
function renderStores() {
  const el = document.getElementById('stores-list');

  if (!db.stores.length) {
    el.innerHTML = "No stores";
    return;
  }

  el.innerHTML = db.stores.map(s => `
    <div class="card">
      ${s.name}
      <button class="delete" onclick="removeStore(${s.id})">❌</button>
    </div>
  `).join('');
}

function renderPrices() {
  const el = document.getElementById('prices-list');

  if (!db.entries.length) {
    el.innerHTML = "No prices";
    return;
  }

  el.innerHTML = db.entries.map(e => `
    <div class="card">
      ${e.name} — ${e.store} — $${e.price.toFixed(2)}
      <button class="delete" onclick="removeEntry(${e.id})">❌</button>
    </div>
  `).join('');
}

function refreshStoreSelects() {
  const el = document.getElementById('p-store');

  el.innerHTML = db.stores.map((s,i)=>
    `<option value="${i}">${s.name}</option>`
  ).join('');
}

/* ───────── DEALS ───────── */
function calculateBestDeals() {
  const result = {};

  db.entries.forEach(e => {
    if (!result[e.name]) {
      result[e.name] = { best:e, worst:e };
    } else {
      if (e.price < result[e.name].best.price) result[e.name].best = e;
      if (e.price > result[e.name].worst.price) result[e.name].worst = e;
    }
  });

  return result;
}

function calculateShoppingPlan() {
  const deals = calculateBestDeals();
  const plan = {};

  Object.values(deals).forEach(d => {
    const best = d.best;

    if (!plan[best.store]) plan[best.store] = [];
    plan[best.store].push(best);
  });

  return plan;
}

function renderDeals() {
  const el = document.getElementById('deals-content');

  if (!db.entries.length) {
    el.innerHTML = "No data yet";
    return;
  }

  const plan = calculateShoppingPlan();

  let total = 0;
  Object.values(calculateBestDeals()).forEach(d => {
    total += d.worst.price - d.best.price;
  });

  el.innerHTML = `
    <div class="card" style="flex-direction:column;align-items:flex-start">
      <b>Smart Plan</b><br><br>
      ${Object.keys(plan).map(store => `
        <b>${store}</b><br>
        ${plan[store].map(i => `• ${i.name} $${i.price}`).join('<br>')}
        <br><br>
      `).join('')}
      <b>Total Saved: $${total.toFixed(2)}</b>
    </div>
  `;
}

/* ───────── SAVINGS ───────── */
function updateSavingsBadge() {
  let total = 0;

  Object.values(calculateBestDeals()).forEach(d => {
    total += d.worst.price - d.best.price;
  });

  document.getElementById('savings-badge').innerText =
    total ? `💰 Save $${total.toFixed(2)}` : "";
}

/* ───────── ALERTS ───────── */
function checkPriceAlerts(entry) {
  if (entry.price < 5) {
    alert(`${entry.name} under $5 ✅`);
  }
}

</script>

</body>
</html>
